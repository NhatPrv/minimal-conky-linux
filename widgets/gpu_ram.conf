conky.config = {
    alignment = 'bottom_right',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = '#00f3ff',
    double_buffer = true,
    draw_borders = false,
    gap_x = 30,
    gap_y = 30,
    minimum_height = 380,
    minimum_width = 380,
    no_buffers = true,
    own_window = true,
    own_window_class = 'ConkyGPURAM',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 1.0,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=8:bold',
}

conky.text = [[
${color #ff0055}┌─[ ${color #00f3ff}GPU // ${execi 5 nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null || echo "iGPU Intel"} (${color #ff0055}${execi 2 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader 2>/dev/null || echo "0 %"}${color #00f3ff}) ${color #ff0055}]
─────────────────────────────────────────────────
${color #00f3ff}VRAM USED:${alignr}${color #ffffff}${execi 2 nvidia-smi --query-gpu=memory.used --format=csv,noheader 2>/dev/null || echo "0 MiB"} / ${execi 10 nvidia-smi --query-gpu=memory.total --format=csv,noheader 2>/dev/null || echo "0 MiB"}
${color #00f3ff}TEMPERATURE:${alignr}${color #ff0055}${execi 2 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader 2>/dev/null || echo "0"}°C
${color #333333}${execigraph 2 "nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null || echo 0" 40,380 00f3ff ff0055}

${color #ff0055}┌─[ ${color #00f3ff}MEMORY // SYSTEM RAM (${color #ff0055}$memperc% UTILIZATION${color #00f3ff}) ${color #ff0055}]
─────────────────────────────────────────────────
${color #00f3ff}USED / TOTAL:${alignr}${color #ffffff}$mem / $memmax
${color #00f3ff}BUFFERS / CACHE:${alignr}${color #ffffff}$buffers / $cached
${color #00f3ff}SWAP USED:${alignr}${color #ffffff}$swap / $swapmax ($swapperc%)
${color #00f3ff}RAM USAGE GRAPH:${color}
${color #333333}${memgraph 40,380 00f3ff ff0055}
${color #ff0055}└─────────────────────────────────────────────────┘${color}
]]
