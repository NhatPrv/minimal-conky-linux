conky.config = {
    alignment = 'bottom_right',
    background = true,
    border_width = 0,
    default_color = '#ffffff',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    gap_x = 35,
    gap_y = 25,
    minimum_height = 1100,
    minimum_width = 440,
    maximum_width = 440,
    no_buffers = true,
    own_window = true,
    own_window_class = 'ConkyGPUDiskWidget',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 1.0,
    use_xft = true,
    font = 'FreeMono:size=9:bold',
}

conky.text = [[
${alignc}${color #00aaff}${font FreeMono:size=22:bold}┌──────[ NETWORK ]──────┐${font}
${voffset 4}${alignc}${color #4db8ff}${font FreeMono:size=15:bold}Local IP: ${execi 10 hostname -I | awk '{print $1}'}${font}

${voffset 4}${offset 11}${color #d0d8e0}${font FreeMono:size=11:bold}Download${goto 230}Upload${font}
${if_up wlan0}\
${offset 11}${color #00f0ff}${font FreeMono:size=16:bold}${downspeed wlan0}${goto 230}${upspeed wlan0}${font}
${voffset -6}
${offset 11}${color #00f0ff}${downspeedgraph wlan0 35,200 0a1d33 00f0ff}${goto 230}${upspeedgraph wlan0 35,200 0a1d33 00f0ff}\
${else}${if_up eth0}\
${offset 11}${color #00f0ff}${font FreeMono:size=16:bold}${downspeed eth0}${goto 230}${upspeed eth0}${font}
${voffset -6}
${offset 11}${color #00f0ff}${downspeedgraph eth0 35,200 0a1d33 00f0ff}${goto 230}${upspeedgraph eth0 35,200 0a1d33 00f0ff}\
${else}\
${offset 11}${color #00f0ff}${font FreeMono:size=16:bold}${downspeed wlp3s0}${goto 230}${upspeed wlp3s0}${font}
${voffset -6}
${offset 11}${color #00f0ff}${downspeedgraph wlp3s0 35,200 0a1d33 00f0ff}${goto 230}${upspeedgraph wlp3s0 35,200 0a1d33 00f0ff}\
${endif}${endif}

${voffset 6}${alignc}${color #00aaff}${font FreeMono:size=22:bold}├──[ PROCESS MONITOR ]──┤${font}

${voffset 2}${alignc}${color #00f0ff}${font FreeMono:size=12:bold}TOP CPU USAGE${font}
${offset 11}${font FreeMono:size=12:bold}${color #ffffff}${top pid 1}${goto 95}${top name 1}${alignr}${color #00f0ff}${top cpu 1}%${font}
${offset 11}${font FreeMono:size=12:bold}${color #d0d8e0}${top pid 2}${goto 95}${top name 2}${alignr}${color #00f0ff}${top cpu 2}%${font}
${offset 11}${font FreeMono:size=12:bold}${color #d0d8e0}${top pid 3}${goto 95}${top name 3}${alignr}${color #00f0ff}${top cpu 3}%${font}

${voffset 4}${alignc}${color #00f0ff}${font FreeMono:size=12:bold}TOP RAM USAGE${font}
${offset 11}${font FreeMono:size=12:bold}${color #ffffff}${top_mem pid 1}${goto 95}${top_mem name 1}${alignr}${color #00f0ff}${top_mem mem_res 1}${font}
${offset 11}${font FreeMono:size=12:bold}${color #d0d8e0}${top_mem pid 2}${goto 95}${top_mem name 2}${alignr}${color #00f0ff}${top_mem mem_res 2}${font}
${offset 11}${font FreeMono:size=12:bold}${color #d0d8e0}${top_mem pid 3}${goto 95}${top_mem name 3}${alignr}${color #00f0ff}${top_mem mem_res 3}${font}

${voffset 4}${alignc}${color #00f0ff}${font FreeMono:size=12:bold}SYSTEM QUICK STATUS${font}
${offset 11}${font FreeMono:size=11:bold}${color #ffffff}BAT${goto 60}${if_match "${battery_state}" == "charging"}${color #00f0ff}${else}${color #ffffff}${endif}${battery_bar 8,310}${alignr}${color #00f0ff}${battery_percent}%${font}

${voffset 2}${offset 11}${font FreeMono:size=11:bold}${color #ffffff}SPK:${goto 60}${execi 1 pactl get-sink-mute @DEFAULT_SINK@ 2>/dev/null | grep -q "yes" && echo "${color #557799}" || echo "${color #00f0ff}"}${execi 2 pactl list sinks 2>/dev/null | grep "Active Port:" | cut -d'-' -f3- | xargs | cut -c1-20}${alignr}${execi 1 pactl get-sink-mute @DEFAULT_SINK@ 2>/dev/null | grep -q "yes" && echo "${color #557799}MUTE" || echo "${color #00f0ff}${execi 1 pactl get-sink-volume @DEFAULT_SINK@ | head -n1 | awk '{print $5}'}"}${font}

${voffset 2}${offset 11}${font FreeMono:size=11:bold}${color #ffffff}MIC:${goto 60}${execi 1 pactl get-source-mute @DEFAULT_SOURCE@ 2>/dev/null | grep -q "yes" && echo "${color #557799}" || echo "${color #00f0ff}"}${execi 2 pactl list sources 2>/dev/null | grep "Active Port:" | cut -d'-' -f3- | xargs | cut -c1-20}${alignr}${execi 1 pactl get-source-mute @DEFAULT_SOURCE@ 2>/dev/null | grep -q "yes" && echo "${color #557799}MUTE" || echo "${color #00f0ff}${execi 1 pactl get-source-volume @DEFAULT_SOURCE@ | head -n1 | awk '{print $5}'}"}${font}

${voffset 6}${alignc}${color #00aaff}${font FreeMono:size=22:bold}├────────[ SSD ]────────┤${font}
${voffset 4}${alignc}${color #4db8ff}${font FreeMono:size=15:bold}NVMe SSD Partition Usage${font}

${voffset 2}${offset 11}${color #00f0ff}${font FreeMono:size=11:bold}ACTIVE: EXT4 Partition ( / )${font}
${offset 11}${color #d0d8e0}${font FreeMono:size=10:bold}Used: ${fs_used /} / ${fs_size /}${alignr}${color #00f0ff}${fs_used_perc /}%${font}
${voffset 2}${offset 11}${color #00f0ff}${fs_bar 8,418 /}${font}

${voffset 4}${offset 11}${color #557799}${font FreeMono:size=10:bold}NTFS Partition ( /dev/nvme0n1p3 )${font}
${offset 11}${color #88aacc}${font FreeMono:size=10:bold}Size: 427 GB${alignr}${color #557799}Unmounted${font}
${voffset 2}${offset 11}${color #224466}${execbar echo 0}${font}

${voffset 4}${offset 11}${color #557799}${font FreeMono:size=10:bold}VFAT Partition ( /boot/efi )${font}
${offset 11}${color #88aacc}${font FreeMono:size=10:bold}Used: ${fs_used /boot/efi} / ${fs_size /boot/efi}${alignr}${color #557799}${fs_used_perc /boot/efi}%${font}
${voffset 2}${offset 11}${color #224466}${fs_bar 6,418 /boot/efi}${font}

${voffset 4}${offset 11}${color #557799}${font FreeMono:size=10:bold}SWAP Partition ( /dev/nvme0n1p7 )${font}
${offset 11}${color #88aacc}${font FreeMono:size=10:bold}Used: ${swap} / ${swapmax}${alignr}${color #557799}${swapperc}%${font}
${voffset 2}${offset 11}${color #224466}${swapbar 6,418}${font}

${voffset 6}${alignc}${color #00aaff}${font FreeMono:size=22:bold}├────────[ GPU ]────────┤${font}
${voffset 4}${alignc}${color #4db8ff}${font FreeMono:size=15:bold}NVIDIA RTX 4060 Laptop${font}

${voffset 2}${offset 11}${color #d0d8e0}GPU Utilization over 60 seconds${alignr}${color #00f0ff}${execi 2 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null || echo 0}%${offset -13}${font}
${voffset -6}
${offset 11}${execgraph "nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null || echo 0" 60,418 0a1d33 00f0ff}

${voffset 4}
${offset 11}${color #d0d8e0}${font FreeMono:size=11:bold}GPU Temp${goto 220}VRAM Usage
${offset 11}${color #ffffff}${font FreeMono:size=16:bold}${execi 2 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits 2>/dev/null || echo 0}°C${goto 220}${execi 2 nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits 2>/dev/null || echo 0} MB${font}

${offset 11}${color #d0d8e0}${font FreeMono:size=11:bold}Power Draw${goto 220}GPU Clock
${offset 11}${color #ffffff}${font FreeMono:size=16:bold}${execi 2 nvidia-smi --query-gpu=power.draw --format=csv,noheader,nounits 2>/dev/null | cut -d'.' -f1 || echo 0} W${goto 220}${execi 2 nvidia-smi --query-gpu=clocks.gr --format=csv,noheader 2>/dev/null || echo "N/A"}${font}

${voffset 6}${alignc}${color #00aaff}${font FreeMono:size=22:bold}└───────────────────────┘${font}
]]
