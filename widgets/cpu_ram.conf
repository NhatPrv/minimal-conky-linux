conky.config = {
    alignment = 'bottom_left',
    background = true,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = '#ffffff',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    gap_x = 35,
    gap_y = 25,
    minimum_height = 1100,
    minimum_width = 440,
    maximum_width = 440,
    no_buffers = true,
    own_window = true,
    own_window_class = 'ConkySystemWidget',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 1.0,
    use_xft = true,
    font = 'FreeMono:size=9:bold',
}

conky.text = [[
${alignc}${color #00aaff}${font FreeMono:size=22:bold}┌────────[ CPU ]────────┐${font}
${voffset 6}${alignc}${color #4db8ff}${font FreeMono:size=15:bold}i9-13900HX @ 5.40 GHz${font}
${voffset 4}${offset 11}${color #d0d8e0}${font FreeMono:size=11:bold}Cores: ${color #ffffff}24${goto 220}${color #d0d8e0}Threads: ${color #ffffff}32${font}

${voffset 2}${offset 11}${color #d0d8e0}% Utilization over 100 seconds${goto 420}${color #00f0ff}${cpu}%${font}
${voffset -10}
${offset 11}${cpugraph cpu1 38,100 0a1d33 00f0ff} ${cpugraph cpu2 38,100 0a1d33 00f0ff} ${cpugraph cpu3 38,100 0a1d33 00f0ff} ${cpugraph cpu4 38,100 0a1d33 00f0ff}
${offset 11}${cpugraph cpu5 38,100 0a1d33 00f0ff} ${cpugraph cpu6 38,100 0a1d33 00f0ff} ${cpugraph cpu7 38,100 0a1d33 00f0ff} ${cpugraph cpu8 38,100 0a1d33 00f0ff}
${offset 11}${cpugraph cpu9 38,100 0a1d33 00f0ff} ${cpugraph cpu10 38,100 0a1d33 00f0ff} ${cpugraph cpu11 38,100 0a1d33 00f0ff} ${cpugraph cpu12 38,100 0a1d33 00f0ff}
${offset 11}${cpugraph cpu13 38,100 0a1d33 00f0ff} ${cpugraph cpu14 38,100 0a1d33 00f0ff} ${cpugraph cpu15 38,100 0a1d33 00f0ff} ${cpugraph cpu16 38,100 0a1d33 00f0ff}
${offset 11}${cpugraph cpu17 38,100 0a1d33 00f0ff} ${cpugraph cpu18 38,100 0a1d33 00f0ff} ${cpugraph cpu19 38,100 0a1d33 00f0ff} ${cpugraph cpu20 38,100 0a1d33 00f0ff}
${offset 11}${cpugraph cpu21 38,100 0a1d33 00f0ff} ${cpugraph cpu22 38,100 0a1d33 00f0ff} ${cpugraph cpu23 38,100 0a1d33 00f0ff} ${cpugraph cpu24 38,100 0a1d33 00f0ff}
${offset 11}${cpugraph cpu25 38,100 0a1d33 00f0ff} ${cpugraph cpu26 38,100 0a1d33 00f0ff} ${cpugraph cpu27 38,100 0a1d33 00f0ff} ${cpugraph cpu28 38,100 0a1d33 00f0ff}
${offset 11}${cpugraph cpu29 38,100 0a1d33 00f0ff} ${cpugraph cpu30 38,100 0a1d33 00f0ff} ${cpugraph cpu31 38,100 0a1d33 00f0ff} ${cpugraph cpu32 38,100 0a1d33 00f0ff}

${voffset 4}
${offset 11}${color #d0d8e0}${font FreeMono:size=11:bold}Speed${goto 220}Max Speed
${offset 11}${color #ffffff}${font FreeMono:size=16:bold}${freq_g} GHz${goto 220}5.40 GHz${font}

${offset 11}${color #d0d8e0}${font FreeMono:size=11:bold}Processes${goto 220}Threads
${offset 11}${color #ffffff}${font FreeMono:size=16:bold}${processes}${goto 220}${threads}${font}

${offset 11}${color #d0d8e0}${font FreeMono:size=11:bold}Temp${goto 220}Up time
${offset 11}${color #ffffff}${font FreeMono:size=16:bold}${hwmon 4 temp 1}°C${goto 220}${uptime}${font}

${voffset 10}${alignc}${color #00aaff}${font FreeMono:size=22:bold}├────────[ RAM ]────────┤${font}
${voffset 6}${alignc}${color #4db8ff}${font FreeMono:size=15:bold}16GB DDR5 @ 5600 MHz${font}

${voffset 2}${offset 11}${color #d0d8e0}Memory usage over 60 seconds${alignr}${color #00f0ff}${memperc}%${offset -13}${font}
${voffset -10}
${offset 11}${memgraph 85,418 0a1d33 00f0ff}

${voffset 4}
${offset 11}${color #d0d8e0}${font FreeMono:size=11:bold}In use (Compressed)${goto 220}Available
${offset 11}${color #ffffff}${font FreeMono:size=16:bold}${mem}${goto 220}${memfree}${font}

${offset 11}${color #d0d8e0}${font FreeMono:size=11:bold}Cached${goto 220}Swap Used
${offset 11}${color #ffffff}${font FreeMono:size=16:bold}${cached}${goto 220}${swap}${font}

${offset 11}${color #d0d8e0}${font FreeMono:size=11:bold}Speed${goto 220}Channel
${offset 11}${color #ffffff}${font FreeMono:size=16:bold}5600 MHz${goto 220}Quad (2x8GB DDR5)${font}

${voffset 6}${alignc}${color #00aaff}${font FreeMono:size=22:bold}└───────────────────────┘${font}
]]
