conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = '#00f3ff',
    default_outline_color = '#00f3ff',
    default_shade_color = '#00f3ff',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    gap_x = 35,
    gap_y = 40,
    minimum_height = 450,
    minimum_width = 300,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 1.0,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=9:bold',
}

conky.text = [[
${color #ff0055}┌─[ ${color #00f3ff}TIME Matrix // CHRONOS ${color #ff0055}]
───────────────
${alignc}${color #00f3ff}${font DejaVu Sans Mono:size=28:bold}${time %H:%M:%S}${font}
${alignc}${color #ffffff}${font DejaVu Sans Mono:size=10:bold}${time %A, %d %B %Y}${font}

${color #ff0055}┌─[ ${color #00f3ff}SYSTEM HUD // LEGION 5 PRO ${color #ff0055}]
───────────────
${color #00f3ff}► HOST:${alignr}${color #ffffff}Kali Linux x86_64
${color #00f3ff}► UPTIME:${alignr}${color #ffffff}$uptime

${color #ff0055}┌─[ ${color #00f3ff}CPU MONITOR // i9-13900HX ${color #ff0055}]
───────────────
${color #00f3ff}TOTAL LOAD:${alignr}${color #ff0055}$cpu%
${color #00f3ff}${cpugraph 30,300 00f3ff ff0055 -l}

${color #00f3ff}CORE ACTIVITY:${color}
${color #ffffff}C1: ${cpu cpu1}% ${color #333333}${cpubar cpu1 6,95 00f3ff ff0055}${alignr}${color #ffffff}C2: ${cpu cpu2}% ${color #333333}${cpubar cpu2 6,95 00f3ff ff0055}
${color #ffffff}C3: ${cpu cpu3}% ${color #333333}${cpubar cpu3 6,95 00f3ff ff0055}${alignr}${color #ffffff}C4: ${cpu cpu4}% ${color #333333}${cpubar cpu4 6,95 00f3ff ff0055}
${color #ffffff}C5: ${cpu cpu5}% ${color #333333}${cpubar cpu5 6,95 00f3ff ff0055}${alignr}${color #ffffff}C6: ${cpu cpu6}% ${color #333333}${cpubar cpu6 6,95 00f3ff ff0055}
${color #ffffff}C7: ${cpu cpu7}% ${color #333333}${cpubar cpu7 6,95 00f3ff ff0055}${alignr}${color #ffffff}C8: ${cpu cpu8}% ${color #333333}${cpubar cpu8 6,95 00f3ff ff0055}

${color #ff0055}┌─[ ${color #00f3ff}MEMORY MATRIX ${color #ff0055}]
───────────────
${color #00f3ff}RAM:${alignr}${color #ffffff}$mem / $memmax ${color #ff0055}($memperc%)
${color #333333}${membar 6,300 00f3ff ff0055}

${color #ff0055}┌─[ ${color #00f3ff}GPU // RTX 4060 DISCRETE ${color #ff0055}]
───────────────
${color #00f3ff}GPU LOAD:${alignr}${color #ff0055}${execi 2 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader 2>/dev/null || echo "0 %"}
${color #00f3ff}VRAM USED:${alignr}${color #ffffff}${execi 2 nvidia-smi --query-gpu=memory.used --format=csv,noheader 2>/dev/null || echo "0 MiB"}
${color #00f3ff}TEMP:${alignr}${color #ff0055}${execi 2 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader 2>/dev/null || echo "0"}°C
${color #333333}${execigraph 2 "nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null || echo 0" 25,300 00f3ff ff0055}
${color #ff0055}└───────────────────────────────┘${color}
]]
